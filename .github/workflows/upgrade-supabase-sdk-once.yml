name: One-time Supabase SDK upgrade

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upgrade-supabase-sdk-once.yml"

permissions:
  contents: write

concurrency:
  group: one-time-supabase-sdk-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.6.12

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install current locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Upgrade Supabase JavaScript SDK
        run: pnpm add @supabase/supabase-js@2.118.0

      - name: Check lint and TypeScript
        run: pnpm check

      - name: Run regression tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

      - name: Commit verified dependency update and remove this one-time workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/upgrade-supabase-sdk-once.yml
          git add package.json pnpm-lock.yaml
          git commit -m "fix: upgrade Supabase SDK auth session handling"
          git push origin HEAD:main
